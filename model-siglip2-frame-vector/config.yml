# GPU is auto-detected at runtime (torch.cuda.is_available); advisory only, matching
# the other model-* taggers.
device: cuda

model:
  # Pulled from the HuggingFace hub the first time the model loads, into the container's
  # HF cache at HF_HOME=/root/.cache. Mount a persistent volume there (see README
  # "Deployment") so the download happens once and is reused across runs.
  #
  # siglip2-base-patch16-naflex = a base ViT image tower + text tower trained with the
  # sigmoid pairwise loss, so the pooled 768-d image embedding is contrastively aligned to
  # text and the same vectors serve image->image and text->image search. NaFlex keeps the
  # frame's native aspect ratio instead of squashing 16:9 into a square.
  #
  # base rather than so400m (1152-d) because the vector db caps dimensions at 1024: 768 is
  # stored whole, where so400m would need a projection applied identically at index and
  # query time.
  # If the vector dimension changes, the search index has to match.
  model_id: google/siglip2-base-patch16-naflex
  # Pin the hub snapshot to a specific commit for reproducibility (threaded into
  # from_pretrained for both the model and the processor). Set to null to track the
  # latest commit on the default branch. Ignored when model_id is a local path.
  revision: b53b807d3a2d5e2b3911292f2d69e5341cdc064c

# runtime tunables (normalize, max_num_patches) are defined in siglip_frame/config.py's
# RuntimeConfig and injected per-request via `--params`. Frame sampling rate (fps) is
# handled generically by the tagger runtime. (README "Runtime parameters" table.)
